<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
<div id="appContainerDiv" class="container-fluid">
 <nav class="navbar  navbar-light bg-light">
   <a class="navbar-brand fw-bold" href="#">Where in the world?</a>
                   <!-- theme toggle button -->
                    <button class="btn btn-outline-secondary d-flex align-items-center me-3" 
                            type="button" 
                            id="themeToggleBtn" 
                            aria-label="Toggle dark/light mode">
                        <span id="themeIcon">☀️ Light</span>
                    </button>
</nav>
 <div class="d-flex align-items-center justify-content-between">

    <form class="d-flex pt-4 my-2 my-lg-0 me-3"> 
      <input class="form-control w-50 me-2" type="search" placeholder="Search" aria-label="Search">
      <button class="btn btn-success" type="submit">Search</button>
    </form>

    <div class="btn-group">
      <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="inside" aria-expanded="false">
        Filter by Region
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">Africa</a></li>
        <li><a class="dropdown-item" href="#">Americas</a></li>
        <li><a class="dropdown-item" href="#">Asia</a></li>
        <li><a class="dropdown-item" href="#">Europe</a></li>
        <li><a class="dropdown-item" href="#">Oceania</a></li>
      </ul>
    </div>
    
</div>
 <div id="countryList">
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="./src/main.js" type="module"></script>
</body>
</html>
